<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☕ Chiya Pasal - Table Self Ordering</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-gray-800 p-4 max-w-md mx-auto">

    <!-- Header -->
    <div class="text-center bg-amber-800 text-white p-4 rounded-2xl shadow-lg mb-4">
        <h1 class="text-xl font-bold">☕ चिया पसल (Self Order)</h1>
        <p id="table-display" class="text-xs text-amber-200 mt-1 font-semibold">टेबल नम्बर: छानिँदैछ...</p>
    </div>

    <!-- Step 1: Customer Details -->
    <div class="bg-white p-4 rounded-xl shadow mb-4 space-y-3">
        <h2 class="text-sm font-bold text-amber-800 border-b pb-1">👤 तपाईंको विवरण भर्नुहोस्</h2>
        <input type="text" id="cust-name" placeholder="तपाईंको नाम" class="w-full border p-2 rounded text-sm outline-none focus:ring-2 focus:ring-amber-500">
        <input type="tel" id="cust-phone" placeholder="फोन नम्बर (SMS Alert को लागि)" class="w-full border p-2 rounded text-sm outline-none focus:ring-2 focus:ring-amber-500">
        <input type="text" id="cust-notes" placeholder="नोट (उदा: कम चिनी, अलि कडा)" class="w-full border p-2 rounded text-xs outline-none">
    </div>

    <!-- Step 2: Menu Items Selection -->
    <div class="bg-white p-4 rounded-xl shadow mb-4 space-y-3">
        <h2 class="text-sm font-bold text-amber-800 border-b pb-1">📜 मेन्युबाट छान्नुहोस्</h2>
        <div id="qr-menu-list" class="space-y-3"></div>
    </div>

    <!-- Bottom Checkout Bar -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white p-4 border-t shadow-2xl flex justify-between items-center rounded-t-2xl">
        <div>
            <p class="text-xs text-gray-500">कुल रकम:</p>
            <p id="total-amount-display" class="text-lg font-extrabold text-amber-800">Rs. 0</p>
        </div>
        <button onclick="placeCustomerOrder()" class="bg-amber-800 hover:bg-amber-900 text-white font-bold px-6 py-2.5 rounded-xl shadow-lg text-sm transition">
            अर्डर गर्नुहोस् 🚀
        </button>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        let tableNo = "1";
        let products = [];
        let orderCart = {};

        document.addEventListener("DOMContentLoaded", () => {
            // Read ?table=X parameter from URL
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('table')) {
                tableNo = urlParams.get('table');
            }
            document.getElementById("table-display").innerText = `🪑 टेबल नम्बर: ${tableNo}`;
            fetchPublicMenu();
        });

        async function fetchPublicMenu() {
            try {
                const res = await fetch(`${API_BASE}/products`);
                products = await res.json();
                const menuList = document.getElementById("qr-menu-list");
                menuList.innerHTML = "";

                products.filter(p => p.is_available).forEach(prod => {
                    menuList.innerHTML += `
                        <div class="flex justify-between items-center p-2 bg-gray-50 rounded-lg border">
                            <div>
                                <p class="font-bold text-sm text-gray-800">${prod.name}</p>
                                <p class="text-xs text-amber-700 font-semibold">Rs. ${prod.price}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="updateQty(${prod.id}, -1)" class="w-7 h-7 bg-amber-200 text-amber-900 font-bold rounded-lg">-</button>
                                <span id="qty-count-${prod.id}" class="text-sm font-bold w-4 text-center">0</span>
                                <button onclick="updateQty(${prod.id}, 1)" class="w-7 h-7 bg-amber-800 text-white font-bold rounded-lg">+</button>
                            </div>
                        </div>`;
                });
            } catch (e) { alert("मेनु लोड हुन सकेन सर्भर चेक गर्नुहोस्!"); }
        }

        function updateQty(productId, change) {
            const currentQty = orderCart[productId] || 0;
            const newQty = Math.max(0, currentQty + change);
            
            if (newQty === 0) delete orderCart[productId];
            else orderCart[productId] = newQty;

            document.getElementById(`qty-count-${productId}`).innerText = newQty;
            calculateTotal();
        }

        function calculateTotal() {
            let total = 0;
            for (let id in orderCart) {
                const prod = products.find(p => p.id == id);
                if (prod) total += prod.price * orderCart[id];
            }
            document.getElementById("total-amount-display").innerText = `Rs. ${total}`;
        }

        async function placeCustomerOrder() {
            const name = document.getElementById("cust-name").value.trim();
            const phone = document.getElementById("cust-phone").value.trim();
            const notes = document.getElementById("cust-notes").value.trim();

            if (!name || !phone) return alert("कृपया तपाईंको नाम र फोन नम्बर लेख्नुहोस्!");

            const items = [];
            for (let id in orderCart) {
                items.push({ product_id: parseInt(id), quantity: orderCart[id] });
            }

            if (items.length === 0) return alert("कृपया कम्तीमा एउटा सामान छान्नुहोस्!");

            const payload = {
                customer_name: name,
                customer_phone: phone,
                table_number: tableNo,
                notes: notes,
                items: items
            };

            try {
                const res = await fetch(`${API_BASE}/public/order`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    alert(`✅ धन्यवाद ${name}! तपाईंको अर्डर (Order #${data.order_id}) सफल भयो। तपाईंलाई SMS अलर्ट पठाइएको छ।`);
                    location.reload();
                } else alert("अर्डर असफल भयो!");
            } catch (e) { alert("Server Connect हुन सकेन!"); }
        }
    </script>
</body>
</html>
